# Render blueprint. Create the service from this file rather than clicking
# through the dashboard, so the config lives in the repo and a rebuild can't
# quietly differ from what's committed.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Then set the secrets marked sync:false in the dashboard (they are
# deliberately not in git).

services:
  - type: web
    name: commissioners-desk
    runtime: python
    plan: starter          # free spins down after 15 min idle; starter stays warm
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --proxy-headers and --forwarded-allow-ips make request.url report the
    # public https URL rather than Render's internal http one.
    startCommand: >
      uvicorn web.app:app
      --host 0.0.0.0
      --port $PORT
      --proxy-headers
      --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CURRENT_SEASON
        value: "2025"
      - key: BASE_URL
        sync: false        # https://yourdomain.com — no trailing slash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false        # service_role key. Never goes near a browser.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAILING_ADDRESS
        sync: false        # CAN-SPAM requires this in marketing footers
      - key: TASK_KEY
        generateValue: true

  # Tuesday 9am ET. Generates the week for every league with auto-send on and
  # emails their subscribers. Idempotent, so a retry can't double-send.
  - type: cron
    name: weekly-papers
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 14 * * 2"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m web.tasks $(python -c "from datetime import date; print(max(1, min(18, (date.today() - date(2025, 9, 2)).days // 7 + 1)))")
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAILING_ADDRESS
        sync: false
