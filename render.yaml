# Render blueprint. Create the service from this file rather than clicking
# through the dashboard, so the config lives in the repo and a rebuild can't
# quietly differ from what's committed.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Then set the secrets marked sync:false in the dashboard (they are
# deliberately not in git).

services:
  - type: web
    name: commissioners-desk
    runtime: python
    plan: standard         # 1 CPU / 2GB. Starter's 512MB ran out of memory on
                           # a busy night (24 Sep); keep this matching the dashboard.
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --proxy-headers and --forwarded-allow-ips make request.url report the
    # public https URL rather than Render's internal http one.
    startCommand: >
      uvicorn web.app:app
      --host 0.0.0.0
      --port $PORT
      --proxy-headers
      --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BASE_URL
        sync: false        # https://yourdomain.com — no trailing slash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false        # service_role key. Never goes near a browser.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAILING_ADDRESS
        sync: false        # CAN-SPAM requires this in marketing footers
      - key: CONTACT_EMAIL
        sync: false        # shown on /privacy and /terms
      - key: OPS_EMAIL
        sync: false        # where the weekly job reports its failures
      - key: SENTRY_DSN
        sync: false        # optional; unset means no error tracking
      - key: PROMO_CODE
        sync: false        # your referral code; turns on the box on every
                           # paper's back page. Unset = no box. The graphic is
                           # web/static/promo/referral.png.
      - key: PROMO_BRAND
        value: "Underdog"
      - key: PROMO_LINK
        sync: false        # optional: your referral link, so the box is clickable
      - key: SAMPLE_PAPER_URL
        sync: false        # a published paper to show on the landing page
      - key: MAX_PAPERS_PER_DAY
        value: "300"       # process-wide ceiling. The API key's own budget
                           # limit is the backstop that survives a restart.
      - key: MAX_CONCURRENT_GENERATIONS
        value: "10"        # papers written at once, per instance. Each one
                           # sends up to 12 requests to Anthropic at a time,
                           # so this must fit the API key's rate-limit tier.
                           # The request threadpool grows with it.
      - key: TRUSTED_PROXY_HOPS
        value: "1"         # proxies between the client and uvicorn. Getting
                           # this wrong makes rate limits spoofable.
      - key: SESSION_SECRET
        generateValue: true   # signs session cookies. Changing it signs
                              # everybody out; leaving it unset regenerates
                              # one per restart, which does the same thing
                              # every deploy.
      - key: TASK_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false        # sk_live_... Never goes near a browser. With this
                           # unset the app runs exactly as it does today:
                           # everybody on the free plan, no upgrade buttons,
                           # every gate still enforced. There is no state in
                           # which forgetting a Stripe variable gives the paid
                           # features away.
      - key: STRIPE_PRICE_ID
        sync: false        # price_... for the $4.99/month recurring price.
                           # The PRICE id, not the product id — a product id
                           # (prod_...) is rejected by Checkout with an error
                           # that does not say which of the two it wanted.
      - key: STRIPE_SEASON_PRICE_ID
        sync: false        # price_... for the $19.99/YEAR recurring price, on
                           # the same product. Optional: unset, the site offers
                           # only the monthly plan.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false        # whsec_... from the webhook endpoint you create in
                           # the Stripe dashboard, pointed at
                           #   https://<your domain>/stripe/webhook
                           # subscribed to: checkout.session.completed and
                           # customer.subscription.created/updated/deleted.
                           #
                           # THIS IS THE PAYWALL'S ONLY LOCK. The webhook is
                           # the sole route that can move somebody onto the
                           # paid plan, and it will not act on a request whose
                           # signature it cannot verify with this value. Unset
                           # means that route 404s — nobody can be upgraded,
                           # including by a stranger who guesses the path.
                           #
                           # Stripe shows a DIFFERENT secret for its CLI test
                           # listener than for a real endpoint. Pasting the
                           # CLI one into production means every real event is
                           # rejected with a 400 and every subscriber pays
                           # while staying on the free tier.
      - key: GOOGLE_CLIENT_ID
        sync: false        # ...apps.googleusercontent.com, from Google Cloud
                           # console -> APIs & Services -> Credentials ->
                           # OAuth 2.0 Client ID (type: Web application).
                           #
                           # Unset means no Google button and routes that 404,
                           # with password sign-in untouched. Same posture as
                           # Stripe: a half-configured deploy shows nothing
                           # rather than a button that fails.
      - key: GOOGLE_CLIENT_SECRET
        sync: false        # From the same screen. Never reaches a browser:
                           # the authorization code is exchanged server-side,
                           # which is what stops a code lifted from somebody's
                           # address bar being enough to sign in as them.
                           #
                           # THE AUTHORIZED REDIRECT URI must be registered in
                           # that console as, exactly:
                           #
                           #   https://<your domain>/auth/google/callback
                           #
                           # Character for character — scheme, host, path, no
                           # trailing slash. A mismatch is refused by Google
                           # before the person ever reaches this app, and the
                           # error page says "redirect_uri_mismatch" and
                           # nothing else. Same class of trap as pasting a
                           # Stripe product id where a price id belongs.
                           #
                           # The consent screen wants a privacy policy and a
                           # terms URL. They are /privacy and /terms.
      - key: PUBLISHER_TOKEN
        sync: false        # opens /publisher/<value>, where the weekly
                           # classifieds page is made.
                           #
                           # NOT generateValue, which is what this said first
                           # and which is a trap here. Render generates a
                           # standard base64 value, and standard base64
                           # includes "/" and "+". This token goes in a URL
                           # PATH, and a "/" in it splits the path — the route
                           # is /publisher/{token}, so a token containing a
                           # slash simply never matches and the page 404s with
                           # nothing to indicate why. Across 43 characters
                           # there is roughly a 75% chance of drawing at least
                           # one; the first generated value happened to miss.
                           #
                           # Generate a URL-safe one instead:
                           #   python3 -c "import secrets; \
                           #       print(secrets.token_urlsafe(32))"
                           # token_urlsafe uses -_ in place of +/ precisely
                           # for this, and the result is safe in a path.
                           #
                           # Unset means the publisher routes 404, which is the
                           # safe direction: a deploy that forgets this turns
                           # the page OFF rather than leaving it open. Changing
                           # it revokes the old URL, which is how to retire a
                           # link that ended up somewhere it should not be.

  # Tuesday 10am and 6pm ET (14:00 and 22:00 UTC; 9am/5pm once clocks go
  # back). Generates the week for every paid league with delivery on and
  # emails the commissioner and subscribers. Idempotent: the evening run only
  # picks up what failed in the morning, and never re-mails anyone.
  - type: cron
    name: weekly-papers
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 14,22 * * 2"
    buildCommand: pip install -r requirements.txt
    # No week argument: the job asks Sleeper what week it is and falls back to
    # nfl_week.py, which derives the opener from Labor Day for any year. This
    # used to be a shell one-liner anchored to a hardcoded 2025 date, which
    # would have written up week 18 every week from 2026 onward.
    startCommand: python -m web.tasks
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAILING_ADDRESS
        sync: false
      - key: OPS_EMAIL
        sync: false        # the job mails its errors here
      - key: SENTRY_DSN
        sync: false
