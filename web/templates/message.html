{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<section class="hero">
    <h1 class="hero-title">{{ heading }}</h1>
    <p class="hero-sub">{{ body }}</p>
    {% if link_url %}
    <p><a class="btn btn-primary" href="{{ link_url }}">{{ link_label }}</a></p>
    {% endif %}
</section>
{% endblock %}
